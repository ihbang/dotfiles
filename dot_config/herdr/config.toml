onboarding = false

[theme]
# tmux: set -g @plugin 'dracula/tmux'
name = "dracula"
auto_switch = false

# Sidebar secondary text (tab, branch, agent, machine names) renders in overlay0,
# and custom metadata tokens in overlay1. Dracula's stock values sit close to the
# panel background (overlay0 #6272a4 is only 3.0:1 against it), so both are lifted
# in HSL lightness with hue and saturation kept intact.
[theme.custom]
overlay0 = "#929dc0"  # was #6272a4 - 3.0:1 -> 5.3:1 against the panel background
overlay1 = "#a8afcb"  # was #828cb4 - 4.3:1 -> 6.6:1

[keys]
# tmux: set-option -g prefix C-a / unbind C-b
prefix = "ctrl+a"

# tmux: bind \ split-window -hc "#{pane_current_path}"
#       bind - split-window -c "#{pane_current_path}"
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"

# tmux: bind -n C-h previous-window / bind -n C-l next-window
previous_tab = "ctrl+h"
next_tab = "ctrl+l"

# tmux: bind -n M-h swap-window -t -1 / bind -n M-l swap-window -t +1
move_tab_previous = "alt+h"
move_tab_next = "alt+l"

new_workspace = "prefix+shift+c"
next_agent = "ctrl+j"
previous_agent = "ctrl+k"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# tmux: bind e new-window '...vi ~/.tmux.conf && tmux source ~/.tmux.conf'
[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = "sh -c 'nvim ~/.config/herdr/config.toml && herdr server reload-config'"
width = "80%"
height = "80%"

[ui]
status_indicators = "dots"

# tmux: bind c new-window (tmux does not ask for a name)
prompt_new_tab_name = true

# The Agents list hardcodes Modifier::DIM on its secondary tokens (machine, tab,
# pane, agent), which halves them again on top of the overlay0 lift above, so
# each of those tokens turns the dim modifier back off. state_icon and workspace
# are left bare because neither is dimmed to begin with.
# Compared to the default rows, machine is dropped, and the second row shows the
# pane name instead of the agent. A pane without a name has no second row.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", dim = false }],
  [{ token = "pane", dim = false }],
]

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
